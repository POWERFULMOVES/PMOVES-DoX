# NATS Configuration for PMOVES-DoX (Enterprise TLS Edition)
# TLS is ENABLED by default for enterprise deployments.
# Certificates: Generate with ./generate-certs.sh, mount to /etc/nats/certs/
#
# NOTE: Authentication is provided via CLI flags (--user/--pass) in
# docker-compose.yml because nats.conf does NOT expand environment variables.

# Core NATS TLS — mutual TLS with client certificate verification
tls {
    cert_file: "/etc/nats/certs/server.crt"
    key_file: "/etc/nats/certs/server.key"
    ca_file: "/etc/nats/certs/ca.crt"
    verify: true
}

websocket {
    port: 9222
    # TLS enabled for enterprise WebSocket connections
    no_tls: false
    tls {
        cert_file: "/etc/nats/certs/server.crt"
        key_file: "/etc/nats/certs/server.key"
    }
    same_origin: false
}

jetstream {
    store_dir: "/data/jetstream"
}
