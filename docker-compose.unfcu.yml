# UNFCU Edition overlay
# Usage: docker compose -f docker-compose.yml -f docker-compose.unfcu.yml up
services:
  frontend:
    build:
      args:
        NEXT_PUBLIC_DOX_EDITION: unfcu
    environment:
      - NEXT_PUBLIC_DOX_EDITION=unfcu

  backend:
    environment:
      - DOX_EDITION=unfcu
      - DB_BACKEND=sqlite
      # Standalone demo JWT — replace with secrets-funnel output for production
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-unfcu-demo-jwt-secret-replace-in-production-64chars-minimum-padding}
      - JWT_SECRET=${JWT_SECRET:-unfcu-demo-jwt-secret-replace-in-production-64chars-minimum-padding}
